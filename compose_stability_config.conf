// AboutLibraries' models are read-only data classes parsed once from the bundled JSON.
com.mikepenz.aboutlibraries.entity.*
// The app never mutates a collection it hands to the UI: lists, maps and sets come from immutable state and are
// replaced, not changed. Treating them as stable lets an equal list (rebuilt by a mapper or a `map {}` in a parent)
// skip recomposition instead of counting as a change because it is a new instance.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
