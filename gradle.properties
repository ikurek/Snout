#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Kotlin/Native compiles in its own process with its own heap, so the iOS release link doesn't share the Gradle daemon's
# heap with whatever ran before it (on Codemagic, the Android release build).
kotlin.native.disableCompilerDaemon=true
kotlin.native.jvmArgs=-Xmx4g
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.experimental.enableScreenshotTest=true
